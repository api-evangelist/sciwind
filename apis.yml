name: SCIWIND
description: 'Sciwind Biosciences (Hangzhou Sciwind Biosciences Co., Ltd.) is a commercial-stage
  biopharmaceutical company headquartered in Hangzhou, China, with a US office in San Ramon,
  California, focused on discovering, developing, and delivering innovative therapeutics for weight
  management and metabolic disease. Its pipeline spans obesity, type 2 diabetes, and non-alcoholic
  steatohepatitis (NASH), led by the GLP-1 receptor agonist Ecnoglutide (advancing through Phase III
  trials). The company operates proprietary drug-discovery platforms including BiasVantage (biased
  agonist discovery), OralVantage (oral peptide delivery), and HaleVantage (half-life extension),
  with 14+ pipeline programs, 120+ researchers, and 110+ patents. Surfaced as a portfolio company of
  IDG Capital and added to the API Evangelist network; enrichment found no public API or developer
  platform surface.'
